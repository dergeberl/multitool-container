name: build-container

on:
  push:
    branches:
    - main
    tags:        
      - v*
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      version:
        description: 'Release version tag to build (e.g. v1.2.3)'
        required: false
        type: string
      sha:
        description: 'Commit SHA to build from (defaults to the triggering SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.sha || github.sha }}
    - name: Compute release tag variants
      id: reltag
      if: ${{ inputs.version != '' }}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="${VERSION#v}"
        majmin="${v%.*}"
        {
          echo "full=$VERSION"
          echo "num=$v"
          echo "majmin=$majmin"
          echo "vmajmin=v$majmin"
        } >> "$GITHUB_OUTPUT"
    - name: Docker meta base
      id: docker_meta_base
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/dergeberl/multitool,dergeberl/multitool
        tags: |
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=raw,value=${{ steps.reltag.outputs.full }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.num }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.majmin }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.vmajmin }},enable=${{ inputs.version != '' }}
    - name: Docker meta net
      id: docker_meta_net
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/dergeberl/multitool-net,dergeberl/multitool-net
        tags: |
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=raw,value=${{ steps.reltag.outputs.full }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.num }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.majmin }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.vmajmin }},enable=${{ inputs.version != '' }}
    - name: Docker meta kubectl
      id: docker_meta_kubectl
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/dergeberl/multitool-kubectl,dergeberl/multitool-kubectl
        tags: |
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=raw,value=${{ steps.reltag.outputs.full }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.num }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.majmin }},enable=${{ inputs.version != '' }}
          type=raw,value=${{ steps.reltag.outputs.vmajmin }},enable=${{ inputs.version != '' }}
    - name: Resolve latest kubectl version
      id: kubectl
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(gh api repos/kubernetes/kubernetes/releases/latest --jq .tag_name)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      with:
        platforms: all
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      if: ${{ github.event_name != 'pull_request' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Login to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      if: ${{ github.event_name != 'pull_request' }}
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    - name: Build and push basic image
      id: docker_build_basic
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta_base.outputs.tags }}
        labels: ${{ steps.docker_meta_base.outputs.labels }}
        target: base
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build and push network image
      id: docker_build_net
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta_net.outputs.tags }}
        labels: ${{ steps.docker_meta_net.outputs.labels }}
        target: net
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build and push kubectl image
      id: docker_build_kubectl
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta_kubectl.outputs.tags }}
        labels: ${{ steps.docker_meta_kubectl.outputs.labels }}
        target: kubectl
        cache-from: type=gha
        cache-to: type=gha,mode=max
